<section class="inner-hero credentials-heading container" aria-labelledby="credentials-title"><div><div class="hero-eyebrow"><p class="eyebrow">{{UI_PRO_CREDENTIALS}}</p>{{DRAFT_BANNER}}</div><h1 id="credentials-title">{{UI_CRED_HEADING}}<br><span>{{UI_CRED_SUBHEADING}}</span></h1><p class="page-lead">{{UI_CRED_LEAD}}</p></div><div class="page-signature"><strong>{{NAME}}</strong><span>{{ROLE}}</span></div></section>
<section class="credential-showcase container" aria-label="{{UI_QUALIFICATIONS}}"><div class="credential-records"><div class="qualification-list">{{EDUCATION}}</div>{{REGISTRATION}}</div><figure class="credential-figure"><div class="credential-surround">{{CREDENTIALS_IMAGE}}</div><figcaption><span>{{UI_PHOTO_KNOWLEDGE}}</span><span>{{LOCATION}}</span></figcaption></figure></section>
<div class="credential-summary container"><p class="eyebrow">{{NAME}}</p><p>{{UI_SUMMARY_HEADING}}<br><span>{{UI_SUMMARY_SUBHEADING}}</span></p><a class="text-link" href="{{EXPERIENCE_URL}}">{{UI_EXPLORE_CLINICAL}} <span aria-hidden="true">↗</span></a></div>
